name: OMNI build and tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/fox-autonomous-engineer-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [test, typecheck, build]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build-script regression test
        if: matrix.check == 'test'
        run: node --test scripts/build-skills.test.mjs
      - name: Generate agent bundle
        if: matrix.check == 'typecheck'
        run: node scripts/build-skills.mjs
      - run: npm run ${{ matrix.check }}

  reference:
    name: Python reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agent-pack/python-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
