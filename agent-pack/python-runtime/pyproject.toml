[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-omnisynapse-local"
version = "1.0.0"
description = "Local evidence-first supervisory intelligence starter for FOX"
requires-python = ">=3.10"

[project.scripts]
omnisynapse = "omnisynapse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnisynapse*"]
